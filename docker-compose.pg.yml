services:
  # 前端服务
  medpro-frontend:
    build:
      context: ./medpro-fastapi-frontend
      dockerfile: Dockerfile
    image: medpro-frontend:latest
    container_name: medpro-frontend
    ports:
      - "12580:80"
    volumes:
      - ./medpro-fastapi-frontend/bin/nginx.dockerpg.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - medpro-backend-pg
    networks:
      - medpro-network

  # 后端服务（PostgreSQL版本）
  medpro-backend-pg:
    build:
      context: ./medpro-fastapi-backend
      dockerfile: Dockerfile.pg
    image: medpro-backend-pg:latest
    container_name: medpro-backend-pg
    ports:
      - "19399:9399"
    depends_on:
      medpro-pg:
        condition: service_healthy
      medpro-redis:
        condition: service_healthy
    networks:
      - medpro-network

  # PostgreSQL服务
  medpro-pg:
    image: postgres:14
    container_name: medpro-pg
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ruoyi-fastapi
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "15432:5432"
    volumes:
      - ./medpro-fastapi-backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi-pg.sql
    networks:
      - medpro-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  medpro-redis:
    image: redis:latest
    container_name: medpro-redis
    ports:
      - "16379:6379"
    networks:
      - medpro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  medpro-network:
    name: medpro-network
    driver: bridge