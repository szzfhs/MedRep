services:
  # 前端服务
  medpro-frontend:
    build:
      context: ./medpro-fastapi-frontend
      dockerfile: Dockerfile
    image: medpro-frontend:latest
    container_name: medpro-frontend
    ports:
      - "12580:80"
    volumes:
      - ./medpro-fastapi-frontend/bin/nginx.dockermy.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - medpro-backend-my
    networks:
      - medpro-network

  # 后端服务（MySQL版本）
  medpro-backend-my:
    build:
      context: ./medpro-fastapi-backend
      dockerfile: Dockerfile.my
    image: medpro-backend-my:latest
    container_name: medpro-backend-my
    ports:
      - "19399:9399"
    depends_on:
      medpro-mysql:
        condition: service_healthy
      medpro-redis:
        condition: service_healthy
    networks:
      - medpro-network

  # MySQL服务
  medpro-mysql:
    image: mysql:8.0
    container_name: medpro-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ruoyi-fastapi
    ports:
      - "13306:3306"
    volumes:
      - ./medpro-fastapi-backend/sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1
    networks:
      - medpro-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  medpro-redis:
    image: redis:latest
    container_name: medpro-redis
    ports:
      - "16379:6379"
    networks:
      - medpro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  medpro-network:
    name: medpro-network
    driver: bridge